<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spellistor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <header class="page-header">
    <h1>Spellistor</h1>
    <p>Skapa och visa musik grupperad efter <b>Genre → Artist → Låtar</b></p>
  </header>

  <main class="layout">

    <!-- LEFT PANEL (FORM) -->
    <section class="card">
      <h2>Skapa ny spellista</h2>

      <form id="playlistForm">

        <label for="playlistName">Spellistans namn</label>
        <input id="playlistName" placeholder="Träningsmix" required>

        <label for="genre">Genre</label>
        <input id="genre" placeholder="Pop" required>

        <label for="artist">Artist</label>
        <input id="artist" placeholder="The Weeknd" required>

        <label for="song">Låt (titel)</label>
        <input id="song" placeholder="Blinding Lights" required>

        <div class="form-buttons">
          <!-- IMPORTANT: must be submit -->
          <button type="submit" class="add-btn">+ Lägg till</button>

          <!-- demo button -->
          <button type="button" id="demoBtn" class="demo-btn">
            Återställ demo-data
          </button>
        </div>

      </form>
    </section>

    <!-- RIGHT PANEL (PLAYLIST OUTPUT) -->
    <section class="card">
      <h2>Alla spellistor</h2>
      <div id="playlistContainer"></div>
    </section>

  </main>

</div>

<!-- APP ENTRY -->
<script type="module" src="js/app.js"></script>

</body>
</html>
