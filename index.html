<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Spellistor</title>
</head>
<body>

<h2>Skapa spellista</h2>

<form id="playlistForm">
  <input id="playlistName" placeholder="Spellista" required>
  <input id="genre" placeholder="Genre" required>
  <input id="artist" placeholder="Artist" required>
  <input id="song" placeholder="Låt" required>
  <button>Lägg till</button>
</form>

<h2>Alla spellistor</h2>
<div id="playlistContainer"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
